<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nydo Chat App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }
    #chat-window {
      width: 80%;
      height: 500px;
      border: 1px solid #ccc;
      padding: 10px;
      overflow-y: auto;
    }
    #message-input {
      width: 80%;
      height: 30px;
      padding: 10px;
      font-size: 16px;
    }
    #send-button {
      width: 15%;
      height: 30px;
      background-color: #4CAF50;
      color: #fff;
      border: none;
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Realtime Chat App</h1><input id="username-input" type="text" placeholder="Enter username">
  <button id="join-button">Join Chat</button>
  <div id="chat-window"></div>
  <input id="message-input" type="text" placeholder="Type a message...">
  <button id="send-button">Send</button>

  <script src="script.js"></script>
</body>
</html>
